steps:
- name: gcr.io/cloud-builders/docker
  args: ["build","-t","asia-south1-docker.pkg.dev/$PROJECT_ID/intelligent-code-reviewer/intelligent-code-reviewer:$COMMIT_SHA","."]
- name: gcr.io/cloud-builders/docker
  args: ["push","asia-south1-docker.pkg.dev/$PROJECT_ID/intelligent-code-reviewer/intelligent-code-reviewer:$COMMIT_SHA"]
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
    ["run","deploy","intelligent-code-reviewer",
     "--image","asia-south1-docker.pkg.dev/$PROJECT_ID/intelligent-code-reviewer/intelligent-code-reviewer:$COMMIT_SHA",
     "--region","asia-south1","--platform","managed","--allow-unauthenticated"]
